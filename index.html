<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文打字練習</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
:root{
  --bg:#f4f1ea; --card:#ffffff; --soft:#f7f5ef; --line:#ddd8c8; --line2:#cfc9b8;
  --ink:#1e2433; --ink2:#3b4357; --mute:#5f6677;
  --blue:#3d56d6; --blue-d:#2f45b8; --ok:#2457e6; --bad:#d6243f; --green:#2d7a56; --amber:#a86a00;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem 1rem}
body.sc{font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif}
#app{background:var(--card);border-radius:20px;padding:2rem;max-width:760px;width:100%;box-shadow:0 6px 28px rgba(60,50,20,.08);border:1px solid var(--line)}

h1{font-size:24px;font-weight:700;color:var(--ink);margin-bottom:1.25rem;letter-spacing:1px}

/* Start Screen */
.start-card{background:var(--soft);border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1rem;border:1px solid var(--line)}
.start-card p{font-size:15px;color:var(--ink2);margin-bottom:1.5rem;line-height:1.8}
.c-ok{color:var(--ok);font-weight:700}
.c-bad{color:var(--bad);font-weight:700}
.tog{font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:1.5rem;user-select:none}
.tog input{accent-color:var(--blue);width:16px;height:16px}

/* 繁/簡選擇 */
.langpick{display:flex;gap:12px;justify-content:center;margin-bottom:1.75rem}
.langbtn{font-family:inherit;font-size:clamp(20px,2.6vw,26px);font-weight:700;padding:14px 28px;border-radius:14px;border:2px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.langbtn:hover{border-color:var(--blue)}
.langbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* Stats bar */
.stats{display:flex;gap:10px;margin-bottom:1rem}
.st{flex:1;background:var(--soft);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.stn{font-size:26px;font-weight:700;color:var(--ink)}
.stl{font-size:11px;color:var(--mute);margin-top:2px;letter-spacing:.5px}

/* Display area - KTV style (light) */
.darea{background:#fffdf8;border-radius:14px;padding:1.5rem 1.5rem 1rem;margin-bottom:1rem;min-height:130px;border:1px solid var(--line);position:relative}
.dtitle{font-size:12px;color:var(--blue);margin-bottom:14px;font-weight:700;letter-spacing:1px}
.cw{display:flex;flex-wrap:wrap;align-items:flex-start;gap:2px 0}

/* Character cells */
.ch{display:inline-flex;flex-direction:column;align-items:center;margin:2px 3px;transition:transform .1s}
.hz{font-size:32px;line-height:1.15;padding:2px 5px;border-radius:5px;transition:color .12s,background .12s}
.py{font-size:11px;min-height:14px;text-align:center;letter-spacing:.3px;transition:color .12s}

/* States */
.ch.pending .hz{color:#3b4357}
.ch.pending .py{color:#6b7385}

.ch.cur .hz{color:#fff;background:var(--blue);animation:pulse .8s ease-in-out infinite}
.ch.cur .py{color:var(--blue);font-weight:700}

.ch.correct .hz{color:var(--ok)}
.ch.correct .py{color:#7f9ae8}

.ch.wrong .hz{color:var(--bad)}
.ch.wrong .py{color:#e58a99}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(61,86,214,.35)}50%{box-shadow:0 0 0 6px rgba(61,86,214,0)}}

/* Input */
.inp-wrap{position:relative;margin-bottom:.75rem}
textarea#inp{width:100%;padding:14px 18px;font-size:20px;border-radius:12px;border:2px solid var(--line2);background:#fff;color:var(--ink);outline:none;resize:none;height:64px;overflow:hidden;font-family:inherit;display:block;transition:border-color .2s,box-shadow .2s}
textarea#inp::placeholder{color:#8a90a0}
textarea#inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(61,86,214,.14)}
.hint{font-size:12px;color:var(--mute);line-height:1.6;margin-bottom:1rem}

/* Output button */
.btn-out{width:100%;padding:14px;border-radius:12px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:16px;font-family:inherit;font-weight:700;letter-spacing:1px;transition:opacity .2s,transform .1s,background .2s;margin-bottom:.5rem}
.btn-out:hover:not(:disabled){background:var(--blue-d)}
.btn-out:active:not(:disabled){transform:scale(.98)}
.btn-out:disabled{cursor:not-allowed}

/* Result */
.rc{background:var(--soft);border-radius:16px;padding:2.5rem;text-align:center;border:1px solid var(--line)}
.rc-label{font-size:13px;color:var(--mute);letter-spacing:1px;margin-bottom:.5rem}
.big{font-size:64px;font-weight:700;color:var(--blue);margin:.25rem 0}
.big span{font-size:22px;font-weight:400;color:var(--mute)}
.enc{font-size:20px;font-weight:700;color:var(--amber);margin:1rem 0 .5rem;letter-spacing:.5px}
.meta{font-size:14px;color:var(--mute);margin-bottom:1.5rem}
.meta b{color:var(--ink)}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button.btnp{padding:12px 32px;border-radius:12px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:15px;font-family:inherit;font-weight:700;transition:opacity .2s}
button.btns2{padding:12px 24px;border-radius:12px;border:2px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer;font-size:15px;font-family:inherit;transition:background .2s}
button.btnp:hover{opacity:.88}
button.btns2:hover{background:#efece3}
button.btng{background:var(--green)}

.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}

/* 頁尾 */
.foot{margin-top:1.25rem;font-size:12px;color:#7a8091;text-align:center;letter-spacing:.5px;padding-bottom:.5rem}

/* ══ 封面指示字放大（教室投影用），練習畫面不變 ══ */
#ss .start-card{padding:3rem 2rem}
#ss .start-card p{font-size:clamp(22px,3vw,30px);line-height:1.8;color:var(--ink2);margin-bottom:2rem}
#ss .tog{font-size:clamp(20px,2.4vw,26px);gap:12px;margin-bottom:2rem}
#ss .tog input{width:26px;height:26px}
#ss .btn-out{max-width:320px !important;font-size:clamp(22px,2.6vw,28px);padding:20px;border-radius:16px}
</style>
</head>
<body>
<div id="app">
  <h1 data-k="title">中文打字練習 ✦</h1>

  <!-- Start -->
  <div id="ss">
    <div class="start-card">
      <div class="langpick">
        <button class="langbtn on" id="lb-tc" onclick="setLang('tc')">繁體中文</button>
        <button class="langbtn" id="lb-sc" onclick="setLang('sc')">简体中文</button>
      </div>
      <p id="intro"></p>
      <label class="tog"><input type="checkbox" id="pyck" checked> <span data-k="pyshow"></span></label><br>
      <button class="btn-out" id="startbtn" data-k="start" style="max-width:220px;margin:0 auto;display:block" onclick="startGame()"></button>
    </div>
  </div>

  <!-- Game -->
  <div id="gs" style="display:none">
    <div class="row">
      <span id="lessonlbl" style="font-size:13px;color:var(--blue);font-weight:700"></span>
      <label class="tog" style="margin:0"><input type="checkbox" id="pyck2" checked onchange="togglePY()"> <span data-k="pytog"></span></label>
    </div>
    <div class="stats">
      <div class="st"><div class="stn" id="sw">0</div><div class="stl" data-k="stw"></div></div>
      <div class="st"><div class="stn" id="se">0</div><div class="stl" data-k="ste"></div></div>
      <div class="st"><div class="stn" id="sa">－</div><div class="stl" data-k="sta"></div></div>
      <div class="st"><div class="stn" id="spg">0%</div><div class="stl" data-k="stp"></div></div>
    </div>
    <div class="darea" id="darea">
      <div class="dtitle" id="dt"></div>
      <div class="cw" id="cw"></div>
    </div>
    <div class="inp-wrap">
      <textarea id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    </div>
    <p class="hint" data-k="hint"></p>
    <div style="display:flex;gap:10px;margin-bottom:.5rem">
      <button class="btn-out" id="outbtn" onclick="showResult()" disabled style="opacity:.35;margin-bottom:0;flex:1"></button>
      <button class="btn-out" id="nextbtn" data-k="next" onclick="nextPassage()" style="margin-bottom:0;flex:0 0 auto;width:auto;padding:14px 20px;background:var(--green);letter-spacing:.5px"></button>
    </div>
  </div>

  <!-- Result -->
  <div id="rs" style="display:none">
    <div class="rc">
      <p class="rc-label" data-k="yours"></p>
      <div class="big"><span id="rcpm" style="font-size:inherit;font-weight:inherit;color:inherit">0</span> <span data-k="unit"></span></div>
      <p class="enc" id="renc"></p>
      <p class="meta"><span data-k="time"></span><b id="rtime">0</b><span data-k="sec"></span><span data-k="tot"></span><b id="rtot">0</b><span data-k="err"></span><b id="rerr">0</b><span data-k="acc"></span><b id="racc">－</b></p>
      <div class="btns">
        <button class="btnp" data-k="again" onclick="startGame()"></button>
        <button class="btnp btng" data-k="next2" onclick="nextPassage()"></button>
        <button class="btns2" data-k="home" onclick="goHome()"></button>
      </div>
    </div>
  </div>
</div>

<div class="foot" data-k="foot">Shelleytaiwan 製作 · 2026 · 請勿商用</div>

<script>
var PASS_T=[
  {t:"課文：友美的生日",p:"這個星期天是友美的生日，她請我、中明和國安一起去她家玩。我們送友美花、兩本中文書、兩枝可愛的小鉛筆和一個大蛋糕，她很喜歡這些禮物。友美請我們吃點心和水果，今天大家都很開心。"},
  {t:"課文：高莉亞的工作",p:"高莉亞在一家賣手機的公司工作，公司有三十幾個人。她有幾個臺灣同事，高莉亞很喜歡跟他們說中文。高莉亞早上六點半起床，起床以後，先洗澡洗頭髮，然後吃早飯。她平常吃一個蛋，喝一杯果汁。吃了早飯，開車去上班。中午休息的時候，她常常在公司一樓的餐廳吃漢堡喝可樂，有時候還吃一個冰淇淋。五點下班，五點半離開辦公室。"},
  {t:"課文：高莉亞的下班後",p:"到了家以後，高莉亞先帶狗出去散步，差不多走二十幾分鐘，然後回家做晚飯。她先生何希常常跟她一起做飯。吃了晚飯，高莉亞喜歡聽聽音樂、看看書。何希常常在網路看看電影、玩玩電腦遊戲。這個星期六高莉亞的朋友要來吃晚飯，她得跟何希一起準備晚飯，所以週末他們一定都很忙。"},
  {t:"短信：給陳老師請假",p:"陳老師好。不好意思，我感冒了，要請假。明天不能去上課。很抱歉，要麻煩您代課了。對不起。謝謝您！"},
  {t:"第1課　今天天氣很好",p:"在臺灣，春天和秋天的天氣很舒服，不冷也不熱，可是夏天太熱了。明文覺得美國的夏天比臺灣的夏天舒服，他可以出去跑步、打網球。美國冬天常常下雪，他很喜歡下雪的時候在家聽音樂。"},
  {t:"第2課　買禮物",p:"明文下個星期二回臺灣，他想給家人買禮物。他想給爸爸買一個背包，給媽媽買一個帽子，他還想給姊姊買兩盒巧克力。因為明文不喜歡逛街，所以他想上網買。"},
  {t:"第3課　紅燒魚非常好吃",p:"明文、麗莎和高莉亞週末一起去餐廳吃飯。聽說那家餐廳酸辣湯和紅燒魚都做得很好。他們點了三碗酸辣湯，還點了一盤炒青菜和一個炸豆腐。因為明文什麼魚都不吃，所以他們沒點紅燒魚。"},
  {t:"第4課　我要一杯熱咖啡",p:"麗莎和高莉亞在一家咖啡店喝咖啡。那家咖啡店的蛋糕做得很好，因為她們都愛吃甜的東西，所以一起點一塊大蛋糕。麗莎還點一杯大杯的冰紅茶和一個雞肉三明治。高莉亞只點一杯小杯的熱牛奶。"},
  {t:"第5課　這件外套怎麼樣",p:"今天高莉亞和麗莎去百貨公司買東西。高莉亞想買一條黑色的裙子和一件運動衫。因為麗莎最近胖了，所以要買一條大號的長褲。雖然她們都覺得白色的裙子很好看，可是也覺得裙子太貴了。"},
  {t:"第6課　我們下個月搬家",p:"凱文現在住在東區，可是他的公司在南區，所以他天天開車上班。從他家開車到公司要開一個鐘頭，凱文覺得太遠了。他想搬到南區，那裡離公司比較近，也想搬到附近有游泳池的地方。"},
  {t:"第7課　超級市場在游泳池旁邊",p:"今天我去凱文家。他家不大，只有一個房間和一間浴室，沒有廚房。他家的旁邊有一家超級市場，對面有一個大公園。凱文喜歡運動，他常去公園跑步。因為晚上天氣不冷不熱，所以我們去公園散步聊天。"},
  {t:"第8課　高莉亞的一天",p:"今天是星期六，何希早上九點起床。起床以後，他先洗澡，然後帶狗出去散步。回家以後，何希跟高莉亞一起準備早飯。吃了早飯，高莉亞去洗衣服，何希在客廳玩電腦遊戲。"},
  {t:"第9課　我感冒了",p:"何希早上起床以後說他身體不舒服。他說他肚子和頭都很痛，所以高莉亞跟他一起去醫院看醫生。醫生看了以後說何希感冒了，應該多喝水、多休息，但是不需要吃藥。所以何希今天沒去上班。"},
  {t:"第10課　高莉亞想去臺灣",p:"高莉亞最近很忙，也很累，但是她下個月有四個星期的假期，可以休息。因為她沒去過亞洲，所以她打算休假的時候去臺灣旅行。明文今年夏天在臺灣，所以他要帶高莉亞去有意思的地方看看，高莉亞很高興。"},
  {t:"短文1　網上購物",p:"現在很多人喜歡網上購物，因為方便又省時間。只需要用手機下單，商品就會送到家裡。不過，要注意選擇信譽好的商店，避免買到假貨。"},
  {t:"短文2　健康飲食",p:"為了保持健康，我們應該多吃蔬菜水果，少吃油膩和太甜的食物。每天喝足夠的水也很重要。養成良好的飲食習慣，身體才會更好。"},
  {t:"短文3　學習外語",p:"學習外語需要耐心和方法。每天堅持練習聽、說、讀、寫，效果會更好。看電影或聽音樂也能幫助提高語言能力。"},
  {t:"短文4　週末計畫",p:"這個週末我打算和朋友去看電影，然後一起吃晚飯。如果天氣好，我們可能去公園散步。放鬆一下，準備迎接新的一週。"},
  {t:"短文5　環保生活",p:"我們應該減少使用塑膠袋，隨手關燈，節約用水。垃圾分類也很重要。每個人都出一份力，地球會變得更乾淨、更美麗。"},
  {t:"短文6　上海旅行",p:"上個月我去上海旅行，那邊的建築很現代，食物也很好吃。我參觀了博物館和公園，拍了很多照片。希望下次能再去。"},
  {t:"短文7　時間管理",p:"合理安排時間能提高效率。可以先把重要的事情做完，再處理小事。避免浪費時間在沒有意義的活動上，生活會更有條理。"},
  {t:"短文8　手機生活",p:"手機已經成為生活中不可缺少的工具。我們可以用它來聯絡朋友、查資料、付錢。但也要注意控制使用時間，保護眼睛。"},
  {t:"短文9　面試技巧",p:"面試時要穿著整齊，態度自信。回答問題要清楚、誠實。提前了解公司的背景，準備好自我介紹，會讓印象分數更高。"},
  {t:"短文10　銀行開戶",p:"去銀行開戶需要帶身份證和印章。填寫表格後，銀行會給你一張提款卡。設定密碼時要記住，不要告訴別人。"},
  {t:"短文11　天氣變化",p:"最近天氣變化很大，早上很熱，晚上卻變冷。出門最好帶一件外套，避免感冒。記得看天氣預報，提前做好準備。"},
  {t:"短文12　搬家",p:"上個月我搬家了，新家離公司更近，交通很方便。整理東西花了不少時間，但住進來後覺得很舒服。鄰居也很友好。"},
  {t:"短文13　圖書館",p:"在圖書館要保持安靜，不能吃東西。借書需要辦借書證，記得按時歸還。圖書館是學習和閱讀的好地方。"},
  {t:"短文14　運動習慣",p:"運動能增強體力，改善心情。每週運動三次，每次半小時，就能感受到變化。跑步、游泳或瑜伽都是不錯的選擇。"},
  {t:"短文15　修燈",p:"家裡的燈壞了，我打電話請師傅來修。他檢查了電線，很快就修好了。學會簡單的修理方法，有時可以自己解決問題。"},
  {t:"短文16　上班交通",p:"上班可以選擇捷運、公車或騎自行車。捷運準時但人多，公車便宜但可能塞車。根據距離和時間選擇最適合的方式。"},
  {t:"短文17　生日派對",p:"朋友為我辦了生日派對，大家吃了蛋糕，唱了生日歌。我收到很實用的禮物，非常開心。這是一個難忘的日子。"},
  {t:"短文18　感冒了",p:"感冒的時候要多休息、多喝水。如果發燒或咳嗽很嚴重，應該去看醫生。按時吃藥，病才會快點好起來。"},
  {t:"短文19　找工作",p:"找工作可以先在網上看招聘資訊。準備好履歷，投給適合的公司。面試前要練習回答問題，保持積極的態度。"},
  {t:"短文20　家人溝通",p:"家人之間應該多溝通，互相理解。如果有不同意見，可以冷靜地討論，不要吵架。良好的家庭關係讓生活更快樂。"}
];

  {t:"课文：友美的生日",p:"这个星期天是友美的生日，她请我、中明和国安一起去她家玩。我们送友美花、两本中文书、两枝可爱的小铅笔和一个大蛋糕，她很喜欢这些礼物。友美请我们吃点心和水果，今天大家都很开心。"},
  {t:"课文：高莉亚的工作",p:"高莉亚在一家卖手机的公司工作，公司有三十几个人。她有几个台湾同事，高莉亚很喜欢跟他们说中文。高莉亚早上六点半起床，起床以后，先洗澡洗头发，然后吃早饭。她平常吃一个蛋，喝一杯果汁。吃了早饭，开车去上班。中午休息的时候，她常常在公司一楼的餐厅吃汉堡喝可乐，有时候还吃一个冰淇淋。五点下班，五点半离开办公室。"},
  {t:"课文：高莉亚的下班后",p:"到了家以后，高莉亚先带狗出去散步，差不多走二十几分钟，然后回家做晚饭。她先生何希常常跟她一起做饭。吃了晚饭，高莉亚喜欢听听音乐、看看书。何希常常在网路看看电影、玩玩电脑游戏。这个星期六高莉亚的朋友要来吃晚饭，她得跟何希一起准备晚饭，所以周末他们一定都很忙。"},
  {t:"短信：给陈老师请假",p:"陈老师好。不好意思，我感冒了，要请假。明天不能去上课。很抱歉，要麻烦您代课了。对不起。谢谢您！"},
  {t:"第1课　今天天气很好",p:"在台湾，春天和秋天的天气很舒服，不冷也不热，可是夏天太热了。明文觉得美国的夏天比台湾的夏天舒服，他可以出去跑步、打网球。美国冬天常常下雪，他很喜欢下雪的时候在家听音乐。"},
  {t:"第2课　买礼物",p:"明文下个星期二回台湾，他想给家人买礼物。他想给爸爸买一个背包，给妈妈买一个帽子，他还想给姊姊买两盒巧克力。因为明文不喜欢逛街，所以他想上网买。"},
  {t:"第3课　红烧鱼非常好吃",p:"明文、丽莎和高莉亚周末一起去餐厅吃饭。听说那家餐厅酸辣汤和红烧鱼都做得很好。他们点了三碗酸辣汤，还点了一盘炒青菜和一个炸豆腐。因为明文什么鱼都不吃，所以他们没点红烧鱼。"},
  {t:"第4课　我要一杯热咖啡",p:"丽莎和高莉亚在一家咖啡店喝咖啡。那家咖啡店的蛋糕做得很好，因为她们都爱吃甜的东西，所以一起点一块大蛋糕。丽莎还点一杯大杯的冰红茶和一个鸡肉三明治。高莉亚只点一杯小杯的热牛奶。"},
  {t:"第5课　这件外套怎么样",p:"今天高莉亚和丽莎去百货公司买东西。高莉亚想买一条黑色的裙子和一件运动衫。因为丽莎最近胖了，所以要买一条大号的长裤。虽然她们都觉得白色的裙子很好看，可是也觉得裙子太贵了。"},
  {t:"第6课　我们下个月搬家",p:"凯文现在住在东区，可是他的公司在南区，所以他天天开车上班。从他家开车到公司要开一个钟头，凯文觉得太远了。他想搬到南区，那里离公司比较近，也想搬到附近有游泳池的地方。"},
  {t:"第7课　超级市场在游泳池旁边",p:"今天我去凯文家。他家不大，只有一个房间和一间浴室，没有厨房。他家的旁边有一家超级市场，对面有一个大公园。凯文喜欢运动，他常去公园跑步。因为晚上天气不冷不热，所以我们去公园散步聊天。"},
  {t:"第8课　高莉亚的一天",p:"今天是星期六，何希早上九点起床。起床以后，他先洗澡，然后带狗出去散步。回家以后，何希跟高莉亚一起准备早饭。吃了早饭，高莉亚去洗衣服，何希在客厅玩电脑游戏。"},
  {t:"第9课　我感冒了",p:"何希早上起床以后说他身体不舒服。他说他肚子和头都很痛，所以高莉亚跟他一起去医院看医生。医生看了以后说何希感冒了，应该多喝水、多休息，但是不需要吃药。所以何希今天没去上班。"},
  {t:"第10课　高莉亚想去台湾",p:"高莉亚最近很忙，也很累，但是她下个月有四个星期的假期，可以休息。因为她没去过亚洲，所以她打算休假的时候去台湾旅行。明文今年夏天在台湾，所以他要带高莉亚去有意思的地方看看，高莉亚很高兴。"},
  {t:"短文1　网上购物",p:"现在很多人喜欢网上购物，因为方便又省时间。只需要用手机下单，商品就会送到家里。不过，要注意选择信誉好的商店，避免买到假货。"},
  {t:"短文2　健康饮食",p:"为了保持健康，我们应该多吃蔬菜水果，少吃油腻和太甜的食物。每天喝足够的水也很重要。养成良好的饮食习惯，身体才会更好。"},
  {t:"短文3　学习外语",p:"学习外语需要耐心和方法。每天坚持练习听、说、读、写，效果会更好。看电影或听音乐也能帮助提高语言能力。"},
  {t:"短文4　周末计划",p:"这个周末我打算和朋友去看电影，然后一起吃晚饭。如果天气好，我们可能去公园散步。放松一下，准备迎接新的一周。"},
  {t:"短文5　环保生活",p:"我们应该减少使用塑胶袋，随手关灯，节约用水。垃圾分类也很重要。每个人都出一份力，地球会变得更干净、更美丽。"},
  {t:"短文6　上海旅行",p:"上个月我去上海旅行，那边的建筑很现代，食物也很好吃。我参观了博物馆和公园，拍了很多照片。希望下次能再去。"},
  {t:"短文7　时间管理",p:"合理安排时间能提高效率。可以先把重要的事情做完，再处理小事。避免浪费时间在没有意义的活动上，生活会更有条理。"},
  {t:"短文8　手机生活",p:"手机已经成为生活中不可缺少的工具。我们可以用它来联络朋友、查资料、付钱。但也要注意控制使用时间，保护眼睛。"},
  {t:"短文9　面试技巧",p:"面试时要穿著整齐，态度自信。回答问题要清楚、诚实。提前了解公司的背景，准备好自我介绍，会让印象分数更高。"},
  {t:"短文10　银行开户",p:"去银行开户需要带身份证和印章。填写表格后，银行会给你一张提款卡。设定密码时要记住，不要告诉别人。"},
  {t:"短文11　天气变化",p:"最近天气变化很大，早上很热，晚上却变冷。出门最好带一件外套，避免感冒。记得看天气预报，提前做好准备。"},
  {t:"短文12　搬家",p:"上个月我搬家了，新家离公司更近，交通很方便。整理东西花了不少时间，但住进来后觉得很舒服。邻居也很友好。"},
  {t:"短文13　图书馆",p:"在图书馆要保持安静，不能吃东西。借书需要办借书证，记得按时归还。图书馆是学习和阅读的好地方。"},
  {t:"短文14　运动习惯",p:"运动能增强体力，改善心情。每周运动三次，每次半小时，就能感受到变化。跑步、游泳或瑜伽都是不错的选择。"},
  {t:"短文15　修灯",p:"家里的灯坏了，我打电话请师傅来修。他检查了电线，很快就修好了。学会简单的修理方法，有时可以自己解决问题。"},
  {t:"短文16　上班交通",p:"上班可以选择捷运、公车或骑自行车。捷运准时但人多，公车便宜但可能塞车。根据距离和时间选择最适合的方式。"},
  {t:"短文17　生日派对",p:"朋友为我办了生日派对，大家吃了蛋糕，唱了生日歌。我收到很实用的礼物，非常开心。这是一个难忘的日子。"},
  {t:"短文18　感冒了",p:"感冒的时候要多休息、多喝水。如果发烧或咳嗽很严重，应该去看医生。按时吃药，病才会快点好起来。"},
  {t:"短文19　找工作",p:"找工作可以先在网上看招聘资讯。准备好履历，投给适合的公司。面试前要练习回答问题，保持积极的态度。"},
  {t:"短文20　家人沟通",p:"家人之间应该多沟通，互相理解。如果有不同意见，可以冷静地讨论，不要吵架。良好的家庭关系让生活更快乐。"}

var UI={tc:{"sub": "", "hint": "打對→藍色 ✦ 打錯→紅色，繼續打下一個字 ✦ 標點自動跳過 ✦ 打完整篇文章後按輸出", "ph": "點這裡，用拼音輸入法打字…", "pytog": "拼音", "stw": "已打字數", "ste": "錯誤次數", "sta": "正確率", "stp": "完成進度", "out": "輸出成績（打完全篇再按）", "outdone": "🎉 輸出成績！", "next": "換下一篇 ↻", "yours": "你的成績", "unit": "字／分鐘", "time": "用時：", "tot": "　總字數：", "err": "　錯誤：", "acc": "　正確率：", "sec": "秒", "again": "再練一次", "next2": "換下一篇", "home": "回主畫面", "m0": "加油！繼續練習，你一定會越來越快的！💪", "m1": "不錯的開始！繼續努力，進步空間很大！🌱", "m2": "很好！你已掌握基本的中文輸入技巧！👍", "m3": "相當流暢！你的中文打字越來越厲害了！🌟", "m4": "太棒了！已達進階水準，繼續保持！🏆", "m5": "驚人的速度！你是中文打字高手！🚀", "m6": " 記得注意正確率喔！", "foot": "Shelleytaiwan 製作 · 2026 · 請勿商用", "start": "開始練習", "pyshow": "顯示拼音", "lessonsub": "僑委會《來！學華語》課文", "title": "中文打字練習 ✦", "intro": "打對的字馬上變<span class=\"c-ok\">藍色</span>，打錯變<span class=\"c-bad\">紅色</span><br>打完整篇文章，按「輸出成績」看速度和評語"},sc:{"sub": "", "hint": "打对→蓝色 ✦ 打错→红色，继续打下一个字 ✦ 标点自动跳过 ✦ 打完整篇文章后按输出", "ph": "点这里，用拼音输入法打字…", "pytog": "拼音", "stw": "已打字数", "ste": "错误次数", "sta": "正确率", "stp": "完成进度", "out": "输出成绩（打完全篇再按）", "outdone": "🎉 输出成绩！", "next": "换下一篇 ↻", "yours": "你的成绩", "unit": "字／分钟", "time": "用时：", "tot": "　总字数：", "err": "　错误：", "acc": "　正确率：", "sec": "秒", "again": "再练一次", "next2": "换下一篇", "home": "回主画面", "m0": "加油！继续练习，你一定会越来越快的！💪", "m1": "不错的开始！继续努力，进步空间很大！🌱", "m2": "很好！你已掌握基本的中文输入技巧！👍", "m3": "相当流畅！你的中文打字越来越厉害了！🌟", "m4": "太棒了！已达进阶水准，继续保持！🏆", "m5": "惊人的速度！你是中文打字高手！🚀", "m6": " 记得注意正确率喔！", "foot": "Shelleytaiwan 制作 · 2026 · 请勿商用", "start": "开始练习", "pyshow": "显示拼音", "lessonsub": "侨委会《来！学华语》课文", "title": "中文打字练习 ✦", "intro": "打对的字马上变<span class=\"c-ok\">蓝色</span>，打错变<span class=\"c-bad\">红色</span><br>打完整篇文章，按“输出成绩”看速度和评语"}};
var lang="tc",PASSAGES=PASS_T,PY=PY_T;
var pollTimer=null;
var startTime=null,totTyped=0,errTyped=0,corrTyped=0,active=false;
var passage="",cursor=0,showPY=true,prevVal="";
var currentIdx=-1;
var charState=[];
var charMap=[];

function setLang(l){
  lang=l;
  PASSAGES=(l==="sc")?PASS_S:PASS_T;
  PY=(l==="sc")?PY_S:PY_T;
  document.body.classList.toggle("sc",l==="sc");
  document.documentElement.lang=(l==="sc")?"zh-CN":"zh-TW";
  document.getElementById("lb-tc").classList.toggle("on",l==="tc");
  document.getElementById("lb-sc").classList.toggle("on",l==="sc");
  applyUI();
}
function applyUI(){
  var T=UI[lang];
  var els=document.querySelectorAll("[data-k]");
  for(var i=0;i<els.length;i++){var k=els[i].getAttribute("data-k");if(T[k]!==undefined)els[i].textContent=T[k];}
  document.getElementById("intro").innerHTML=T.intro;
  document.getElementById("inp").placeholder=T.ph;
  document.title=T.title.replace(" ✦","");
  var ob=document.getElementById("outbtn");
  ob.textContent=ob.disabled?T.out:T.outdone;
}

// 破音字／多音字：依前後字修正
var PYRULES=[
  {c:"樂",alt:"乐",prev:"快",py:"lè",def:"yuè"},
  {c:"行",alt:"行",prev:"銀",altprev:"银",py:"háng"},
  {c:"得",alt:"得",next:"跟",py:"děi"},
  {c:"假",alt:"假",next:"貨",altnext:"货",py:"jiǎ"},
  {c:"发",alt:"发",prev:"頭",altprev:"头",py:"fà"}
];
function pinyinAt(i){
  var ch=passage[i],prev=passage[i-1]||"",next=passage[i+1]||"";
  var py=PY[ch]||"";
  for(var k=0;k<PYRULES.length;k++){
    var r=PYRULES[k];
    if(ch!==r.c&&ch!==r.alt)continue;
    if(r.prev!==undefined){
      if(prev===r.prev||prev===r.altprev){py=r.py;break;}
      if(r.def){py=r.def;}
    }
    if(r.next!==undefined&&(next===r.next||next===r.altnext)){py=r.py;break;}
  }
  return py;
}

function isPunct(c){return"。，！？、；：「」『』“”…".includes(c);}

function goHome(){
  stopAll();
  document.getElementById("ss").style.display="block";
  document.getElementById("gs").style.display="none";
  document.getElementById("rs").style.display="none";
}
function stopAll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  active=false;
}
function togglePY(){
  showPY=document.getElementById("pyck2").checked;
  renderAll();
}

function startGame(){
  stopAll();
  var ck=document.getElementById("ss").style.display==="none"?document.getElementById("pyck2"):document.getElementById("pyck");
  showPY=ck.checked;
  var idx=Math.floor(Math.random()*PASSAGES.length);
  currentIdx=idx;
  loadPassage(idx);
}

function nextPassage(){
  stopAll();
  var ck=document.getElementById("pyck2")||document.getElementById("pyck");
  if(ck) showPY=ck.checked;
  var idx;
  do { idx=Math.floor(Math.random()*PASSAGES.length); } while(idx===currentIdx && PASSAGES.length>1);
  currentIdx=idx;
  loadPassage(idx);
}

function loadPassage(idx){
  var L=PASSAGES[idx];
  passage=L.p;
  startTime=null;
  totTyped=0;errTyped=0;corrTyped=0;cursor=0;prevVal="";

  charMap=[];
  for(var i=0;i<passage.length;i++){
    if(!isPunct(passage[i])) charMap.push(i);
  }
  charState=new Array(charMap.length).fill("pending");

  document.getElementById("sw").textContent="0";
  document.getElementById("se").textContent="0";
  document.getElementById("sa").textContent="－";
  document.getElementById("spg").textContent="0%";
  document.getElementById("lessonlbl").textContent=L.t;
  document.getElementById("dt").textContent="";
  document.getElementById("pyck2").checked=showPY;

  renderAll();
  document.getElementById("ss").style.display="none";
  document.getElementById("rs").style.display="none";
  document.getElementById("gs").style.display="block";

  var outbtn=document.getElementById("outbtn");
  outbtn.disabled=true;
  outbtn.style.opacity=".35";
  outbtn.textContent=UI[lang].out;

  var inp=document.getElementById("inp");
  inp.value="";
  inp.removeEventListener("compositionend",onCompose);
  inp.removeEventListener("input",onInput);
  inp.addEventListener("compositionend",onCompose);
  inp.addEventListener("input",onInput);
  inp.focus();
  active=true;
}

function renderAll(){
  var cw=document.getElementById("cw");
  cw.innerHTML="";
  var ci=0;
  for(var i=0;i<passage.length;i++){
    var ch=passage[i];
    var isp=isPunct(ch);
    var cls;
    if(isp){
      cls="ch punct";
    } else {
      var st=charState[ci];
      var isCur=(ci===cursor && ci<charMap.length);
      if(isCur) cls="ch cur";
      else if(st==="correct") cls="ch correct";
      else if(st==="wrong") cls="ch wrong";
      else cls="ch pending";
      ci++;
    }
    var d=document.createElement("span");
    d.className=cls;
    d.id="c"+i;
    var hz=document.createElement("span");
    hz.className="hz";
    hz.textContent=ch;
    d.appendChild(hz);
    if(showPY&&!isp){
      var ps=document.createElement("span");
      ps.className="py";
      ps.textContent=pinyinAt(i);
      d.appendChild(ps);
    }
    cw.appendChild(d);
  }
}

function updateChar(cursorIdx,state){
  charState[cursorIdx]=state;
  var passIdx=charMap[cursorIdx];
  var el=document.getElementById("c"+passIdx);
  if(!el)return;
  el.className="ch "+state;
}
function markCursor(cursorIdx){
  if(cursorIdx>=charMap.length)return;
  var passIdx=charMap[cursorIdx];
  var el=document.getElementById("c"+passIdx);
  if(!el)return;
  el.className="ch cur";
  el.scrollIntoView({block:"nearest",behavior:"smooth"});
}

var composing=false;
function onCompose(e){
  var s=e.data||"";
  for(var i=0;i<s.length;i++) processChar(s[i]);
  setTimeout(function(){
    var el=document.getElementById("inp");
    if(el){el.value="";}
  },0);
}
function onInput(e){
  if(e.isComposing||composing) return;
  var el=document.getElementById("inp");
  if(!el) return;
  var val=el.value;
  for(var i=0;i<val.length;i++) processChar(val[i]);
  el.value="";
}
function processChar(ch){
  if(!active)return;
  if(isPunct(ch))return;
  if(cursor>=charMap.length)return;

  if(!startTime) startTime=Date.now();

  var target=passage[charMap[cursor]];
  totTyped++;

  if(ch===target){
    updateChar(cursor,"correct");
    corrTyped++;
  } else {
    updateChar(cursor,"wrong");
    errTyped++;
  }
  cursor++;
  if(cursor<charMap.length){
    markCursor(cursor);
  } else {
    active=false;
    stopAll();
    var outbtn=document.getElementById("outbtn");
    outbtn.disabled=false;
    outbtn.style.opacity="1";
    outbtn.textContent=UI[lang].outdone;
  }

  document.getElementById("sw").textContent=corrTyped;
  document.getElementById("se").textContent=errTyped;
  var acc=totTyped>0?Math.round(corrTyped/totTyped*100):0;
  document.getElementById("sa").textContent=acc+"%";
  var pct=Math.round(cursor/charMap.length*100);
  document.getElementById("spg").textContent=pct+"%";
}

function showResult(){
  stopAll();
  var T=UI[lang];
  var elapsed=startTime?(Date.now()-startTime)/1000:1;
  var wpm=Math.round(corrTyped/(elapsed/60));
  var acc=totTyped>0?Math.round(corrTyped/totTyped*100):0;
  document.getElementById("rcpm").textContent=wpm;
  document.getElementById("rtot").textContent=totTyped;
  document.getElementById("rerr").textContent=errTyped;
  document.getElementById("rtime").textContent=Math.round(elapsed);
  document.getElementById("racc").textContent=acc+"%";

  var msg;
  if(wpm<10) msg=T.m0;
  else if(wpm<20) msg=T.m1;
  else if(wpm<35) msg=T.m2;
  else if(wpm<50) msg=T.m3;
  else if(wpm<70) msg=T.m4;
  else msg=T.m5;
  if(acc<70) msg+=T.m6;

  document.getElementById("renc").textContent=msg;
  document.getElementById("gs").style.display="none";
  document.getElementById("rs").style.display="block";
}

setLang("tc");

</script>
